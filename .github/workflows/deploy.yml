# Builds the site and publishes it to GitHub Pages (custom domain: valett.si).
name: Deploy to GitHub Pages
on:
  push:
    branches: [claude/new-session-790f1f, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          FORMSPREE_ID: ${{ secrets.FORMSPREE_ID }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          key: cd8df2ff6de06232be66e54bac95e726 # public by design; must match public/<key>.txt and site.indexNowKey
        run: |
          sleep 20
          urls=$(curl -s https://valett.si/sitemap-0.xml http://valett.si/sitemap-0.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | sort -u | jq -R . | jq -sc .)
          echo "key $key, urls $urls"
          curl -s -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"valett.si\",\"key\":\"$key\",\"keyLocation\":\"https://valett.si/$key.txt\",\"urlList\":$urls}"
